<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">DetectiveBoard logo</title>
  <desc id="description">A cork investigation board with pinned evidence, red string, and a Detectiveboards note.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b36a28"/>
      <stop offset="0.5" stop-color="#6d3518"/>
      <stop offset="1" stop-color="#3d2114"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#24130b" flood-opacity=".55"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#2e160b" flood-opacity=".5"/>
    </filter>
    <pattern id="cork" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#b87537"/>
      <circle cx="2" cy="3" r=".7" fill="#77401e" opacity=".55"/>
      <circle cx="9" cy="8" r=".8" fill="#d99b57" opacity=".65"/>
      <path d="M4 10l2-1M7 2l2 1M1 7l2 .5" stroke="#8c5127" stroke-width=".7" opacity=".55"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="252" height="252" rx="49" fill="url(#frame)" stroke="#32190e" stroke-width="3"/>
  <rect x="11" y="11" width="234" height="234" rx="39" fill="#8c4c22" stroke="#d09251" stroke-width="3"/>
  <rect x="18" y="18" width="220" height="220" rx="30" fill="url(#cork)" stroke="#4c2815" stroke-width="3"/>

  <g filter="url(#paper)" transform="rotate(-5 63 68)">
    <path d="M38 33h50v65H38z" fill="#e6d5ae"/>
    <path d="M43 38h40v44H43z" fill="#c4b68f"/>
    <path d="M48 77c3-13 10-19 16-20-5-5-6-13-2-18 7 3 12 12 12 22 5 4 7 9 8 16z" fill="#4c463b"/>
    <path d="M43 87h34" stroke="#8f7c5e" stroke-width="2"/>
  </g>
  <g filter="url(#paper)" transform="rotate(8 205 66)">
    <path d="M178 35h51v61h-51z" fill="#dfd1b2"/>
    <path d="M184 41h39v39h-39z" fill="#c7baa0"/>
    <path d="M185 75l13-13 8 6 16-18M185 50l12 8 12-10 13 8" fill="none" stroke="#9b8c72"/>
    <circle cx="211" cy="70" r="7" fill="none" stroke="#a52a1e" stroke-width="2"/>
  </g>
  <g filter="url(#paper)" transform="rotate(7 56 199)">
    <path d="M35 169h42v61H35z" fill="#e4d5b5"/>
    <ellipse cx="55" cy="198" rx="9" ry="15" fill="#776a57"/>
    <path d="M48 211c5-15 8-29 15-37M45 205c9-11 11-22 13-31M51 214c8-15 13-23 15-36" stroke="#4e473e" stroke-width=".8" opacity=".7"/>
  </g>
  <g filter="url(#paper)" transform="rotate(-6 198 201)">
    <path d="M177 170h43v63h-43z" fill="#ded0af"/>
    <text x="198" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#3b3026">?</text>
  </g>

  <g fill="none" stroke="#a82018" stroke-width="2.4" filter="url(#shadow)">
    <path d="M57 35L129 91 204 40"/>
    <path d="M58 175L128 190 198 179"/>
    <path d="M129 91L128 190"/>
  </g>

  <g filter="url(#paper)" transform="rotate(-3 130 135)">
    <path d="M60 94h139v78H60z" fill="#efbd55"/>
    <text x="130" y="143" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#1d120b">Detectiveboards</text>
  </g>

  <g fill="#c72d1e" stroke="#75160f" stroke-width="1" filter="url(#shadow)">
    <circle cx="57" cy="35" r="5"/><circle cx="204" cy="40" r="5"/>
    <circle cx="129" cy="91" r="6"/><circle cx="58" cy="175" r="5"/>
    <circle cx="198" cy="179" r="5"/><circle cx="128" cy="190" r="5"/>
  </g>
</svg>
