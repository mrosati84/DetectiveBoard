{% extends 'base.html' %}

{% block title %}DetectiveBoard — Shared Board{% endblock %}

{% block content %}
<!-- Auth header (read-only) -->
<header id="auth-header">
    <a id="auth-logo" href="/">&#128269; DetectiveBoard</a>
    <div id="auth-controls">
        <span id="shared-badge">&#128279; View only</span>
        <div id="auth-logged-out">
            <button class="auth-btn" onclick="openRegisterModal()">Sign up</button>
            <button class="auth-btn auth-btn-primary" onclick="openLoginModal()">Log in</button>
        </div>
        <div id="auth-logged-in" style="display:none;">
            <span id="auth-username"></span>
            <button class="auth-btn" onclick="window.location.href='/board'">My boards</button>
        </div>
    </div>
</header>

<!-- Cork board -->
<div id="board">
    <div id="canvas">
        <svg id="connections-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="no-board-msg" style="display:none;"></div>
</div>

<!-- Reset pan button -->
<button id="reset-pan-btn" onclick="resetPan()" title="Reset pan" style="display:none;">&#8982; Reset Pan</button>

{% include 'partials/modals/_login_modal.html' %}
{% include 'partials/modals/_register_modal.html' %}
{% endblock %}

{% block scripts %}
<script>
    window.SHARE_TOKEN = {{ token | tojson }};
</script>
<script src="{{ url_for('static', filename='js/shared.js') }}"></script>
{% endblock %}
