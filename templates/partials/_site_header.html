<header id="auth-header" class="home-header">
    <a id="auth-logo" href="/">
        <img src="/assets/detectiveboard-logo.svg" alt="" width="28" height="28" class="home-logo-img">
        <span>DetectiveBoard</span>
    </a>
    <div id="auth-controls">
        <div id="auth-logged-out" style="display:flex;">
            <button class="auth-btn" onclick="openLoginModal()">Log in</button>
            <button class="auth-btn auth-btn-primary" onclick="openRegisterModal()"
                data-goatcounter-click="cta-header" data-goatcounter-title="CTA: header sign up">Sign up</button>
        </div>
    </div>
</header>
