<!-- Login modal -->
<div id="login-modal-overlay">
    <div id="login-modal">
        <h2>Log in</h2>
        <form id="login-form" hx-post="/api/auth/login" hx-target="#login-error" hx-swap="innerHTML"
            hx-disabled-elt="find button[type='submit']">
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" required autocomplete="current-password">
            </div>
            <p id="login-error" class="auth-error"></p>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeLoginModal()">Cancel</button>
                <button type="submit" class="btn-primary">Log in</button>
            </div>
        </form>
        <p class="auth-switch">Don't have an account? <a href="#"
                onclick="closeLoginModal(); openRegisterModal(); return false;">Sign up</a></p>
    </div>
</div>
