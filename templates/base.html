<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DetectiveBoard{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}A detective-style cork board for suspects, clues and connections. Pin cards, draw red yarn and solve the mystery.{% endblock %}">
    <meta name="robots" content="{% block meta_robots %}noindex, follow{% endblock %}">
    {% block canonical %}{% endblock %}

    <meta property="og:site_name" content="DetectiveBoard">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="{{ self.meta_description() }}">
    <meta property="og:url" content="{{ site_url }}{{ request.path }}">
    <meta property="og:image" content="{{ site_url }}/static/img/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="DetectiveBoard — a detective-style cork board with pinned evidence and red yarn">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ self.title() }}">
    <meta name="twitter:description" content="{{ self.meta_description() }}">
    <meta name="twitter:image" content="{{ site_url }}/static/img/og-image.jpg">

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon-96x96.png') }}" type="image/png" sizes="96x96">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#2a1e14">
    <meta name="application-name" content="DetectiveBoard">
    <meta name="apple-mobile-web-app-title" content="DetectiveBoard">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script data-goatcounter="https://detectiveboard.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
    {% block scripts %}<script src="{{ url_for('static', filename='js/board.js') }}"></script>{% endblock %}
</body>
</html>
